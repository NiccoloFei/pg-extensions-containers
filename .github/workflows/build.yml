name: Container Images Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'docker-bake.hcl'
      - 'pgvector/**'
      - 'postgis/**'

permissions: read-all

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [pgvector, postgis]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup env
        id: env
        run: |
          EXT_VERSIONS=$(jq -r '.versions | join(",")' "${{ matrix.name }}/.versions.json")
          echo "ext_versions=${EXT_VERSIONS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/bake-action@v6
        env:
          environment: ${{ (github.ref == 'refs/heads/main') && 'production' || 'testing' }}
          registry: ghcr.io/${{ github.repository_owner }}
          extension_name: ${{ matrix.name }}
          extension_versions: ${{ steps.env.outputs.ext_versions }}
        with:
          push: true
